<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Nigalya</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="jost-font">
  <section class="bg-img">
    <div class="container">
      <nav class="d-flex nav-bar">
        <div>
          <img class="d-lg-none" src="/assets/images/svg/nav-icon.svg" alt="">
        </div>
        <div onclick="navbarbtn()" class="z-5  d-lg-none">
          <span class="menu-lines " id="rotats"></span>
          <span class="menu-lines " id="transparent"></span>
          <span class="menu-lines " id="rotats2"></span>
        </div>
        <ul id="nav-name" class="list-unstyled nav-link  d-flex">
          <li class="pt-27 pl-23">
            <img class="nav-ico" src="/assets/images/svg/nav-icon.svg" alt="">

          </li>
          <li>
            <ul class="d-flex list-unstyled gap-50 pt-31 pt items-center">
              <li class="fc-white fs-sm fw-sm lh-1  ">HOME</li>
              <li class="fc-white fs-sm fw-sm lh-1  ">ABOUT</li>
              <li class="fc-white fs-sm fw-sm lh-1  ">ROADMAP</li>
              <li class="fc-white fs-sm fw-sm lh-1  ">TEAM</li>
              <li class="fc-white fs-sm fw-sm lh-1  ">FAQ</li>
            </ul>
          </li>
          <li>
            <ul class="list-unstyled d-flex gap-20 pt-26">
              <li><img src="/assets/images/svg/twitter.svg" alt=""></li>
              <li><img src="/assets/images/svg/telegram.svg" alt=""></li>
              <li><img src="/assets/images/svg/insta.svg" alt=""></li>
              <li><img src="/assets/images/svg/discord.svg" alt=""></li>
            </ul>
          </li>
        </ul>
      </nav>

      <div class="col-6">
        <img class="panda-img" src="/assets/images/png/nigalya-img.png" alt="">
      </div>
    </div>
  </section>
  <script >const navbarbtn = () => {
    document.getElementById("nav-name").classList.toggle("show-nvabar")
    document.getElementById("rotats").classList.toggle("rotate40")
    document.getElementById("transparent").classList.toggle("bg-transparent")
    document.getElementById("rotats2").classList.toggle("rotate-45")
    document.body.classList.toggle("overflow-hidden")
  }</script>
</body>

</html>
